name: Unpack source
on:
  push:
    paths: ["*source.tar.gz"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -xzf *source.tar.gz && rm *source.tar.gz
      - run: |
          git config user.name "Maris Purgailis"
          git config user.email "41898282+mpurgailis@users.noreply.github.com"
          git add -A
          git commit -m "Publish Common Ground carbon marketplace"
          git push
