name: Unpack source
on:
  push:
    paths: ["foundation-source.tar.gz"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -xzf foundation-source.tar.gz && rm -f ./*source.tar.gz
      - run: |
          git config user.name "Maris Purgailis"
          git config user.email "41898282+mpurgailis@users.noreply.github.com"
          git add -A
          git commit -m "Publish production marketplace foundation"
          git push
